repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        language: system
        entry: cargo fmt --check
        pass_filenames: false
        types_or: [rust, toml]
      - id: cargo-clippy
        name: cargo clippy
        language: system
        entry: cargo clippy --all-targets -- -D warnings
        pass_filenames: false
        types_or: [rust, toml]
      - id: cargo-check
        name: cargo check
        language: system
        entry: cargo check --all-targets
        pass_filenames: false
        types_or: [rust, toml]
